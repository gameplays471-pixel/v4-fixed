<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GEMgym — Sem conexão</title>
  <link rel="icon" href="/icons/icon-192.png" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: #04060a;
      color: #f7f7f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 32px;
      text-align: center;
    }
    img {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      opacity: 0.95;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0;
      font-weight: 600;
    }
    p {
      margin: 0;
      max-width: 320px;
      color: #9a9a9a;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    button {
      margin-top: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: #00e099;
      color: #04060a;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="/icons/icon-192.png" alt="GEMgym" />
    <h1>Sem conexão no momento</h1>
    <p>
      Parece que o sinal caiu. Assim que a internet da academia voltar,
      é só tentar de novo — seus treinos salvos continuam aqui.
    </p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
