openapi: 3.0.3
info:
  title: GEMgym Admin API
  version: "1.0"
servers:
  - url: /api/admin
paths:
  /users:
    get:
      summary: List users
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: role
          schema: { type: string, enum: [user, admin, support] }
        - in: query
          name: status
          schema: { type: string, enum: [all, active, disabled] }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated users
  /users/{id}:
    get:
      summary: User detail + business report
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Detail with report
    put:
      summary: Update user
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                name: { type: string }
                role: { type: string }
                disabled: { type: boolean }
      responses:
        "200":
          description: Updated
  /assign-workouts:
    post:
      summary: Assign template workouts to student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, templateIds]
              properties:
                userId: { type: string }
                templateIds:
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 20
      responses:
        "200":
          description: Assigned copies
  /assign-plans:
    post:
      summary: Assign weekly plans to student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, planTemplateIds]
              properties:
                userId: { type: string }
                planTemplateIds:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Assigned plans
  /audit-log:
    get:
      summary: Audit feed
      parameters:
        - in: query
          name: entityType
          schema: { type: string }
        - in: query
          name: action
          schema: { type: string, enum: [create, update, delete] }
        - in: query
          name: page
          schema: { type: integer }
      responses:
        "200":
          description: Entries
